<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cachorros Articulados</title>
<style>
  :root {
    --fundo: #f6f1e7; --cartao: #fffdf8; --texto: #2b2420; --suave: #7a6d62;
    --linha: #e4dacb; --acento: #c8642d; --acento-texto: #fff; --chao: #e9dfcd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #1d1a17; --cartao: #27231f; --texto: #f1e9df; --suave: #b3a597;
      --linha: #3b352f; --acento: #e07a3f; --acento-texto: #1d1a17; --chao: #332d27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px;
         display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--suave); }
  .palco { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; }
  .painel { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; align-self: start; }
  .painel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 14px 0 8px; }
  .painel h2:first-child { margin-top: 0; }
  .botoes { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid var(--linha); background: transparent; color: var(--texto);
           padding: 6px 14px; min-height: 44px; border-radius: 999px; cursor: pointer; }   /* 44 px: bom de tocar */
  button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
  button:disabled { opacity: .4; cursor: default; }
  label.check { display: flex; align-items: center; gap: 8px; margin: 0; min-height: 44px; }
  label.check input { width: 20px; height: 20px; }
  .junta { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .junta input { grid-column: 1 / -1; width: 100%; accent-color: var(--acento); }
  .junta output { text-align: right; color: var(--suave); font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--suave); margin: 12px 0 6px; }
  .vel { display: flex; align-items: center; gap: 8px; }
  .vel input { flex: 1; accent-color: var(--acento); }
</style>
</head>
<body>
<main>
  <section>
    <h1>Cachorros articulados</h1>
    <p class="sub">Cada cachorro foi recortado em cabeça, tronco, rabo e 3 pedaços por pata. As peças giram nas juntas sem abrir buraco. Em "Poses desenhadas" ficam os desenhos inteiros de cada ação.</p>
    <div class="palco"><canvas id="tela" width="1024" height="1024"></canvas></div>
  </section>
  <aside class="painel">
    <h2>Cachorro</h2>
    <div class="botoes" id="cachorros"></div>
    <h2>Movimento</h2>
    <div class="botoes" id="movimentos">
      <button data-mov="parado">Parado</button>
      <button data-mov="andar">Andar</button>
      <button data-mov="correr">Correr</button>
      <button data-mov="rabo">Abanar o rabo</button>
      <button data-mov="latir" id="btnLatir">Latir</button>
      <button data-mov="pata">Dar a pata</button>
    </div>
    <h2>Poses desenhadas</h2>
    <div class="botoes" id="poses"></div>
    <div class="vel" style="margin-top:10px"><span>Velocidade</span><input type="range" id="vel" min="0.2" max="2" step="0.1" value="1"></div>
    <h2>Ver</h2>
    <label class="check"><input type="checkbox" id="piscar" checked> Piscar sozinho</label>
    <label class="check"><input type="checkbox" id="mostrarJuntas"> Mostrar juntas</label>
    <label class="check"><input type="checkbox" id="separar"> Separar as peças</label>
    <label class="check"><input type="checkbox" id="original"> Ver desenho original</label>
    <details id="manual">
      <summary>Mexer cada junta à mão</summary>
      <div id="juntas"></div>
      <button id="zerar" style="margin-top:6px">Voltar ao normal</button>
    </details>
  </aside>
</main>
<script src="rig.js"></script>
<script src="poses.js"></script>
<script>
const NOMES = {
  cabeca: 'Cabeça', rabo: 'Rabo',
  pata_frente_perto_0: 'Frente perto · braço', pata_frente_perto_1: 'Frente perto · antebraço', pata_frente_perto_2: 'Frente perto · pé',
  pata_frente_longe_0: 'Frente longe · braço', pata_frente_longe_1: 'Frente longe · antebraço', pata_frente_longe_2: 'Frente longe · pé',
  pata_tras_perto_0: 'Trás perto · coxa', pata_tras_perto_1: 'Trás perto · canela', pata_tras_perto_2: 'Trás perto · pé',
  pata_tras_longe_0: 'Trás longe · coxa', pata_tras_longe_1: 'Trás longe · canela', pata_tras_longe_2: 'Trás longe · pé',
};
// qual imagem de cabeca usar para "boca aberta" e "boca fechada" em cada cachorro
const BOCA = {
  pincher_malhado: { aberta: 'boca_aberta', fechada: null },
  maya: { aberta: null, fechada: 'boca_fechada' },
};
// boca da cabeca de olhos fechados: so pisca quando a boca do momento e a mesma
// (senao o piscar abriria/fecharia a boca de repente)
const BOCA_DO_PISCAR = { pincher_malhado: 'fechada', pincher_caramelo: 'fechada', maya: 'aberta' };
const BOCA_NORMAL = { pincher_malhado: 'fechada', pincher_caramelo: 'fechada', maya: 'aberta' };

const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
const imagens = {};
let atual = Object.keys(RIGS)[0];
let mov = 'andar';
let manual = {};      // angulos (graus) escolhidos a mao
let usandoManual = false;
let poseDesenho = null;   // id de uma pose desenhada (desenhos/animacao) ou null = cachorro recortado
let foto = null;          // ultima imagem da tela, para a troca entre desenho e recortado ser suave
let t0 = performance.now(), tempo = 0, ultimo = t0;

function carregar(src) {
  if (!imagens[src]) { const im = new Image(); im.src = src; imagens[src] = im; }
  return imagens[src];
}
for (const [k, r] of Object.entries(RIGS)) {
  r.partes.forEach(p => carregar(p.arquivo));
  Object.values(r.cabecas).forEach(c => carregar(c.arquivo));
  carregar(r.original);
}
for (const d of Object.values(window.POSES || {}))
  d.poses.forEach(p => p.quadros.forEach(q => carregar(q.arquivo)));

// guarda a tela atual para ela sumir aos poucos por cima da nova
function fotografar() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  c.getContext('2d').drawImage(tela, 0, 0);
  foto = { c, ini: performance.now() };
}

// ---------- interface ----------
const divC = document.getElementById('cachorros');
for (const [k, r] of Object.entries(RIGS)) {
  const b = document.createElement('button');
  b.textContent = r.nome; b.dataset.k = k;
  b.onclick = () => {
    if (poseDesenho) fotografar();
    atual = k;
    if (poseDesenho && !(POSES[atual]?.poses || []).some(p => p.id === poseDesenho)) poseDesenho = null;
    montarJuntas(); montarPoses(); atualizarBotoes();
  };
  divC.appendChild(b);
}
document.querySelectorAll('#movimentos button').forEach(b => b.onclick = () => {
  if (poseDesenho) fotografar();
  mov = b.dataset.mov; usandoManual = false; poseDesenho = null; tempo = 0; atualizarBotoes();
});
function montarPoses() {
  const div = document.getElementById('poses');
  div.innerHTML = '';
  for (const p of (window.POSES?.[atual]?.poses || [])) {
    const b = document.createElement('button');
    b.textContent = p.nome; b.dataset.pose = p.id;
    b.onclick = () => { fotografar(); poseDesenho = p.id; usandoManual = false; tempo = 0; atualizarBotoes(); };
    div.appendChild(b);
  }
}
function atualizarBotoes() {
  divC.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === atual));
  document.querySelectorAll('#movimentos button').forEach(b =>
    b.setAttribute('aria-pressed', !usandoManual && !poseDesenho && b.dataset.mov === mov));
  document.querySelectorAll('#poses button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.pose === poseDesenho));
  document.getElementById('btnLatir').disabled = !BOCA[atual];
  if (!BOCA[atual] && mov === 'latir') mov = 'parado';
  const temRabo = RIGS[atual].partes.some(p => p.id === 'rabo');   // o malhado (desenho atual) nao tem rabo
  document.querySelector('[data-mov="rabo"]').disabled = !temRabo;
  if (!temRabo && mov === 'rabo') mov = 'parado';
}
function montarJuntas() {
  const div = document.getElementById('juntas');
  div.innerHTML = '';
  manual = {};
  for (const p of RIGS[atual].partes) {
    if (!p.pai) continue;
    manual[p.id] = 0;
    const w = document.createElement('div');
    w.className = 'junta';
    w.innerHTML = `<span>${NOMES[p.id] || p.nome}</span><output>0°</output>
      <input type="range" min="-70" max="70" value="0" step="1">`;
    const inp = w.querySelector('input'), out = w.querySelector('output');
    inp.oninput = () => {
      if (poseDesenho) { fotografar(); poseDesenho = null; }
      manual[p.id] = +inp.value; out.textContent = inp.value + '°'; usandoManual = true; atualizarBotoes();
    };
    div.appendChild(w);
  }
}
document.getElementById('zerar').onclick = () => {
  document.querySelectorAll('#juntas input').forEach(i => { i.value = 0; i.oninput(); });
};
montarJuntas(); montarPoses(); atualizarBotoes();

// ---------- poses ----------
const rad = g => g * Math.PI / 180;
function mult(a, b) { // matrizes 2D [a,b,c,d,e,f]
  return [a[0]*b[0] + a[2]*b[1], a[1]*b[0] + a[3]*b[1], a[0]*b[2] + a[2]*b[3], a[1]*b[2] + a[3]*b[3],
          a[0]*b[4] + a[2]*b[5] + a[4], a[1]*b[4] + a[3]*b[5] + a[5]];
}
function giro(px, py, r) {
  const c = Math.cos(r), s = Math.sin(r);
  return [c, s, -s, c, px - c*px + s*py, py - s*px - c*py];
}
// O cachorro sobe ou desce inteiro para que a pata mais baixa encoste no chao:
// nao afunda nem flutua, e o balanco do corpo sai das proprias patas.
// (As poses do passo levantam a pata com o pe reto, para os dedos nao rasparem
// o chao no meio do passo; senao o corpo daria um pulinho.)
function apoiarNoChao(P) {
  const rig = RIGS[atual], porId = {}, mundo = {};
  rig.partes.forEach(p => porId[p.id] = p);
  const matriz = p => mundo[p.id] || (mundo[p.id] = !p.pai
    ? giro(p.eixo[0], p.eixo[1], P.corpoA)
    : mult(matriz(porId[p.pai]), giro(p.eixo[0], p.eixo[1], P.ang[p.id] || 0)));
  let desce = -Infinity;
  for (const p of rig.partes) {
    if (!p.solas) continue;
    const chao = Math.max(...p.solas.map(q => q[1]));   // chao desta pata (as de longe ficam mais altas)
    const m = matriz(p);
    for (const [x, y] of p.solas) desce = Math.max(desce, m[1] * x + m[3] * y + m[5] - chao);
  }
  return { ...P, corpoY: -desce };
}
function pataPose(a, lado, q, forca) {
  const s = Math.sin(q), lev = Math.max(0, Math.cos(q));
  if (lado === 'frente') {
    a[0] = -forca * (0.32 * s + 0.18 * lev);   // no passo o ombro levanta a pata
    a[1] = forca * 0.75 * lev;
    a[2] = -forca * 0.40 * lev;                 // compensa o antebraco: pe quase reto, dedos longe do chao
  } else {
    a[0] = -forca * 0.30 * s;
    a[1] = forca * 0.60 * lev;
    a[2] = -forca * 0.45 * lev;
  }
}
function pose(t) {
  const P = { corpoY: 0, corpoA: 0 }, ang = {};
  const set = (id, v) => ang[id] = v;
  const pata = (nome, lado, q, f) => { const a = [0, 0, 0]; pataPose(a, lado, q, f); a.forEach((v, i) => set(`pata_${nome}_${i}`, v)); };
  let cabeca = 'normal';
  const amp = RIGS[atual].amplitude || 1;   // patas curtas (Maya) dobram menos
  if (mov === 'andar' || mov === 'correr') {
    const corre = mov === 'correr';
    const p = t * Math.PI * 2 * (corre ? 1.9 : 1.1);
    const f = (corre ? 1.45 : 1) * amp;
    if (corre) { // galope: patas da frente juntas, de tras juntas
      pata('frente_perto', 'frente', p, f); pata('frente_longe', 'frente', p + 0.5, f);
      pata('tras_perto', 'tras', p + Math.PI, f); pata('tras_longe', 'tras', p + Math.PI + 0.5, f);
      P.corpoA = 0.06 * Math.sin(p);
    } else {     // trote: pares em diagonal
      pata('tras_perto', 'tras', p, f); pata('frente_longe', 'frente', p, f);
      pata('tras_longe', 'tras', p + Math.PI, f); pata('frente_perto', 'frente', p + Math.PI, f);
      P.corpoA = 0.015 * Math.sin(p);
    }
    set('cabeca', -0.04 * Math.sin(2 * p) - P.corpoA);
    set('rabo', 0.3 * Math.sin(p * 1.5));
  } else if (mov === 'rabo') {
    const p = t * Math.PI * 2 * 2.4;
    set('rabo', 0.55 * Math.sin(p));
    set('cabeca', 0.08 * Math.sin(t * 2.2));
    P.corpoA = 0.012 * Math.sin(p);
  } else if (mov === 'latir') {
    const ciclo = (t * 1.6) % 1;
    const late = ciclo < 0.35;
    cabeca = late ? 'aberta' : 'fechada';
    const k = late ? Math.sin(ciclo / 0.35 * Math.PI) : 0;
    set('cabeca', -0.14 * k);
    P.corpoA = -0.02 * k;
    set('pata_frente_perto_0', 0.05 * k); set('pata_frente_longe_0', 0.05 * k);
    set('rabo', 0.25 * Math.sin(t * 14));
  } else if (mov === 'pata') {
    const k = (0.5 - 0.5 * Math.cos(Math.min(t, 1.2) / 1.2 * Math.PI)) * amp;
    const bal = t > 1.2 ? Math.sin((t - 1.2) * 6) : 0;   // comeca do zero: sem tranco
    set('pata_frente_perto_0', -0.75 * k + 0.08 * bal);
    set('pata_frente_perto_1', -0.55 * k);
    set('pata_frente_perto_2', 0.7 * k + 0.15 * bal);
    set('cabeca', 0.12 * k + 0.05 * Math.sin(t * 1.7));
    set('rabo', 0.4 * Math.sin(t * 13));
    P.corpoA = -0.025 * k;
  } else { // parado, respirando
    set('cabeca', 0.03 * Math.sin(t * 0.9));
    set('rabo', 0.08 * Math.sin(t * 1.3));
  }
  if (ang.rabo) ang.rabo *= RIGS[atual].amplitude_rabo || 1;   // rabo cortado mexe pouco
  P.ang = ang; P.cabeca = cabeca;
  return apoiarNoChao(P);
}

// ---------- desenho ----------
function cabecaAtual(rig, P, piscando) {
  const b = BOCA[atual];
  let nome = null;
  if (P.cabeca === 'aberta' && b) nome = b.aberta;
  if (P.cabeca === 'fechada' && b) nome = b.fechada;
  const bocaAgora = P.cabeca === 'normal' ? BOCA_NORMAL[atual] : P.cabeca;
  if (piscando && rig.cabecas.olhos_fechados && bocaAgora === BOCA_DO_PISCAR[atual]) nome = 'olhos_fechados';
  return nome ? rig.cabecas[nome] : null;
}
// Ao trocar de movimento, de cachorro ou entrar no modo manual, a pose desliza da
// ultima pose mostrada ate a nova em TROCA_MS, em vez de pular de uma vez.
const TROCA_MS = 350;
let modoAnterior = null, troca = null, poseMostrada = null;
function suavizarTroca(P, agora) {
  const modo = `${atual}|${usandoManual ? 'manual' : mov}`;
  if (modoAnterior !== null && modo !== modoAnterior && poseMostrada) troca = { de: poseMostrada, ini: agora };
  modoAnterior = modo;
  if (troca) {
    const u = Math.min(1, (agora - troca.ini) / TROCA_MS);
    const s = u * u * (3 - 2 * u);
    if (u >= 1) troca = null;
    else {
      const de = troca.de, ang = {};
      for (const k of new Set([...Object.keys(de.ang), ...Object.keys(P.ang)]))
        ang[k] = (de.ang[k] || 0) * (1 - s) + (P.ang[k] || 0) * s;
      P = { ...P, ang, corpoY: de.corpoY * (1 - s) + P.corpoY * s, corpoA: de.corpoA * (1 - s) + P.corpoA * s };
    }
  }
  poseMostrada = P;
  return P;
}
function desenhar(agora) {
  const vel = +document.getElementById('vel').value;
  tempo += (agora - ultimo) / 1000 * vel; ultimo = agora;
  const rig = RIGS[atual];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1024, 1024);
  const cs = getComputedStyle(document.documentElement);

  // chao
  ctx.fillStyle = cs.getPropertyValue('--chao');
  ctx.beginPath(); ctx.ellipse(512, 972, 380, 26, 0, 0, Math.PI * 2); ctx.fill();
  const anda = poseDesenho ? ['andando', 'correndo'].includes(poseDesenho) : (mov === 'andar' || mov === 'correr');
  const corre = poseDesenho ? poseDesenho === 'correndo' : mov === 'correr';
  if (anda) {
    ctx.strokeStyle = cs.getPropertyValue('--linha'); ctx.lineWidth = 6; ctx.lineCap = 'round';
    const passo = 120, desl = (tempo * (corre ? 520 : 200)) % passo;
    for (let x = -passo; x < 1100; x += passo) {
      ctx.beginPath(); ctx.moveTo(x - desl, 1008); ctx.lineTo(x - desl + 50, 1008); ctx.stroke();
    }
  }

  if (document.getElementById('original').checked) {
    ctx.drawImage(carregar(rig.original), 0, 0);
    return terminarQuadro(agora);
  }
  if (poseDesenho) {
    desenharPose(tempo);
    return terminarQuadro(agora);
  }

  let P = usandoManual ? apoiarNoChao({ corpoY: 0, corpoA: 0, cabeca: 'normal',
    ang: Object.fromEntries(Object.entries(manual).map(([k, v]) => [k, rad(v)])) }) : pose(tempo);
  P = suavizarTroca(P, agora);
  const piscando = document.getElementById('piscar').checked && ((agora / 1000) % 3.4) < 0.14;
  const separar = document.getElementById('separar').checked;

  const mundo = {};
  const partes = rig.partes;
  const porId = Object.fromEntries(partes.map(p => [p.id, p]));
  function matriz(p) {
    if (mundo[p.id]) return mundo[p.id];
    let m;
    if (!p.pai) {
      m = mult([1, 0, 0, 1, 0, P.corpoY], giro(p.eixo[0], p.eixo[1], P.corpoA));
    } else {
      m = mult(matriz(porId[p.pai]), giro(p.eixo[0], p.eixo[1], P.ang[p.id] || 0));
    }
    return mundo[p.id] = m;
  }
  const centro = porId.tronco.eixo;
  for (const p of [...partes].sort((a, b) => a.z - b.z)) {
    let m = matriz(p);
    if (separar) {
      const cx = p.x + p.w / 2 - centro[0], cy = p.y + p.h / 2 - centro[1];
      m = mult([1, 0, 0, 1, cx * 0.18, cy * 0.18], m);
    }
    ctx.setTransform(...m);
    let src = p;
    if (p.id === 'cabeca') src = cabecaAtual(rig, P, piscando) || p;
    const im = carregar(src.arquivo);
    if (im.complete) ctx.drawImage(im, src.x, src.y);
  }
  if (document.getElementById('mostrarJuntas').checked) {
    for (const p of partes) {
      if (!p.pai) continue;
      const m = matriz(porId[p.pai]);
      const x = m[0]*p.eixo[0] + m[2]*p.eixo[1] + m[4], y = m[1]*p.eixo[0] + m[3]*p.eixo[1] + m[5];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#e0302a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
  terminarQuadro(agora);
}
// a tela anterior (foto) some aos poucos por cima da nova
function terminarQuadro(agora) {
  if (foto) {
    const u = (agora - foto.ini) / 300;
    if (u >= 1) foto = null;
    else {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1 - u * u * (3 - 2 * u);
      ctx.drawImage(foto.c, 0, 0);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(desenhar);
}

// ---------- poses desenhadas ----------
// Cada pose e um desenho inteiro. Andando/correndo alternam os quadros 1 e 2; as
// outras ganham uma mexidinha (respirar, tremer, ofegar...). A escala de cada
// desenho (poses.js) deixa o cachorro do mesmo tamanho, e o pe mais baixo fica
// no mesmo chao do cachorro recortado.
const QUADROS_POR_SEG = { andando: 3, correndo: 6 };
function efeitoPose(id, t) {
  const e = { dx: 0, dy: 0, sx: 1, sy: 1 };
  const passo = Math.abs(Math.sin(t * (QUADROS_POR_SEG[id] || 1) * Math.PI));
  if (id === 'andando') e.dy = -3 * passo;
  else if (id === 'correndo') e.dy = -8 * passo;
  else if (id === 'dormindo_deitado') e.sy = 1 + 0.02 * Math.sin(t * 1.8);         // respira devagar
  else if (id === 'tremendo_frio') e.dx = 2.5 * Math.sin(t * 110);                  // treme
  else if (id === 'sentindo_calor') e.sy = 1 + 0.012 * Math.sin(t * 15);            // ofega
  else if (id === 'rosnando') e.dx = 1.5 * Math.sin(t * 55);                        // sacode
  else if (id === 'latindo') { const k = Math.max(0, Math.sin(t * 9)); e.dy = -10 * k; e.sy = 1 + 0.02 * k; }
  else if (id === 'bebendo' || id === 'comendo') e.dy = 2 * Math.sin(t * 7);       // cabeca mexendo
  else e.sy = 1 + 0.008 * Math.sin(t * 2.4);                                         // respira
  return e;
}
function desenharPose(t) {
  const d = POSES[atual], p = d && d.poses.find(x => x.id === poseDesenho);
  if (!p) return;
  const n = p.quadros.length;
  const q = p.quadros[n > 1 ? Math.floor(t * (QUADROS_POR_SEG[p.id] || 2)) % n : 0];
  const im = carregar(q.arquivo);
  if (!im.complete) return;
  const s = q.escala, e = efeitoPose(p.id, t);
  const x0 = d.centro - q.centro * s + e.dx, y0 = d.chao - q.fundo * s + e.dy;
  // escala em volta do pe (centro de baixo), para respirar sem sair do chao
  ctx.setTransform(s * e.sx, 0, 0, s * e.sy,
                   x0 + s * q.centro * (1 - e.sx), y0 + s * q.fundo * (1 - e.sy));
  ctx.drawImage(im, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
requestAnimationFrame(desenhar);
</script>
