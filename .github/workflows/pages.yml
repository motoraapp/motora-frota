name: Publicar MOTORA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Montar o site (cópia de todos os arquivos do app, igual ao Netlify)
        run: |
          mkdir -p _site
          # copia tudo do repositório, menos o que não faz parte do app
          git ls-files | grep -vE '^(\.github/|android/|CLAUDE\.md$|\.gitignore$)' \
            | xargs -d '\n' cp --parents -t _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
