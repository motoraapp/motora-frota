name: Publicar MOTORA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Montar o site (cópia de todos os arquivos do app)
        run: |
          mkdir -p _site
          # copia tudo do repositório, menos o que não faz parte do app
          git ls-files | grep -vE '^(\.github/|android/|supabase/|robo-whatsapp/|CLAUDE\.md$|\.gitignore$)' \
            | xargs -d '\n' cp --parents -t _site/
          touch _site/.nojekyll
          # cópia de teste da IA do dono (ramo teste-ia): endereço do banco trocado, só abre a demonstração e não enxerga dado real
          if git fetch --depth=1 origin teste-ia 2>/dev/null; then
            mkdir -p _site/teste
            cp _site/manifest.json _site/icon-192.png _site/icon-512.png _site/teste/ 2>/dev/null || true
            git show FETCH_HEAD:index.html | sed -E 's#https://[a-z0-9]+\.supabase\.co#https://teste.invalid#g' > _site/teste/index.html
          fi
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
