name: Publicar MOTORA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Montar o site (só os arquivos do app)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js *.png _site/
          [ -f motora.apk ] && cp motora.apk _site/ || true
          [ -f apk-version.json ] && cp apk-version.json _site/ || true
          cp -r .well-known _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
