name: Verificar código do MOTORA

on:
  push:
    branches: [main, teste-ia]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir sintaxe do app, robô e arquivos JSON
        run: node .github/scripts/verificar.mjs
      - name: Teste de regressão da lentidão (recarga sem consultas em fila)
        run: node .github/scripts/teste-recarga.mjs
      - name: Teste do modo automático do ar-condicionado (liga e desliga)
        run: node .github/scripts/teste-ar-auto.mjs
      - name: Teste da Siri do Nossa casinha (frase vira comando)
        run: node .github/scripts/teste-ar-siri.mjs

  placa-ar:
    # Compila o programa da placa do ar-condicionado (ar/firmware/gree-esp32) para garantir que não quebrou.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyserial
      - uses: arduino/setup-arduino-cli@v2
      # Cada passo mostra o fim do erro como aviso no GitHub (o registro completo só abre com login).
      - name: Instalar núcleo ESP32 2.0.17
        run: |
          U=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          { arduino-cli core update-index --additional-urls $U && arduino-cli core install esp32:esp32@2.0.17 --additional-urls $U; } > log.txt 2>&1 \
            || { echo "::error::$(tail -c 900 log.txt | tr '\n' ' ')"; exit 1; }
      - name: Instalar bibliotecas
        run: |
          arduino-cli lib install "IRremoteESP8266@2.8.6" "DHT sensor library@1.4.6" "Adafruit Unified Sensor@1.1.15" "ArduinoJson@7.2.1" > log.txt 2>&1 \
            || { echo "::error::$(tail -c 900 log.txt | tr '\n' ' ')"; exit 1; }
      - name: Compilar a placa
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs ar/firmware/gree-esp32 > log.txt 2>&1 \
            || { echo "::error::$(grep -m5 -i 'error' log.txt | tr '\n' ' ') $(tail -c 400 log.txt | tr '\n' ' ')"; exit 1; }
          tail -n 3 log.txt
