name: Verificar código do MOTORA

on:
  push:
    branches: [main, teste-ia]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir sintaxe do app, robô e arquivos JSON
        run: node .github/scripts/verificar.mjs
      - name: Teste de regressão da lentidão (recarga sem consultas em fila)
        run: node .github/scripts/teste-recarga.mjs
